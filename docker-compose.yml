services:
  server:
    build: .
    command:
      - /server
      - -leak=${LEAK:-read}
      - -fix=${FIX:-false}
      - -conn-bytes=65536
      - -idle-timeout=5s
      - -metrics-path=/metrics/${LEAK:-read}-${FIX:-false}.csv
    mem_limit: 256m
    memswap_limit: 256m        # same as mem_limit = no swap, dies instead of hanging
    ulimits:
      nofile: 1048576          # maximum number of open files
    restart: on-failure        # OOM kill exits with 137 -> restarts -> restart count increases
    ports: ["9000:9000", "6060:6060"]
    volumes: ["./metrics:/metrics"]

  loadgen:
    build: .
    command:
      - /loadgen
      - -addr=server:9000
      - -mode=${MODE:-silent}
      - -rate=50
    ulimits:
      nofile: 1048576
    depends_on: [server]